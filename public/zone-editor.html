<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>찰랑 권역 편집기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css"/>
<style>
  :root{--bg:rgba(255,255,255,.96);--fg:#1c1c1e;--muted:#6b6b70;--accent:#ff7a1a;--lock:#e0361f;--mine:#12a150;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;color:var(--fg)}
  #map{position:absolute;inset:0}
  #crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:600;pointer-events:none;width:36px;height:36px}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:var(--lock);box-shadow:0 0 0 1px rgba(255,255,255,.8)}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  #crosshair .dot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--lock);transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  #panel{position:fixed;top:12px;right:12px;z-index:700;width:320px;max-width:calc(100vw - 24px);background:var(--bg);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px;backdrop-filter:blur(8px);max-height:calc(100vh - 24px);overflow:auto}
  #panel h1{font-size:15px;margin:0 0 6px}
  .modeBadge{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;color:#fff}
  .modeBadge.read{background:#8e8e93}.modeBadge.write{background:var(--accent)}
  .readout{background:#f4f4f6;border-radius:10px;padding:10px;margin:8px 0;font-size:13px;line-height:1.5}
  .readout .zone{font-size:15px;font-weight:700}.readout .muted{color:var(--muted)}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;font-size:13px;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;background:#e9e9ee;color:var(--fg)}
  button.primary{background:var(--accent);color:#fff}button.ghost{background:transparent;border:1px solid #d0d0d5}
  button:disabled{opacity:.4;cursor:not-allowed}button:active:not(:disabled){transform:translateY(1px)}
  .online{font-size:12px;color:var(--muted);margin:4px 0 8px}
  .online b{color:var(--fg)}
  .field{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;font-size:12px;color:var(--muted)}
  .field input{font:inherit;font-size:13px;color:var(--fg);padding:7px 8px;border:1px solid #d0d0d5;border-radius:8px}
  .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;border-radius:16px;padding:20px;width:320px;max-width:calc(100vw - 24px)}
  .modal h2{font-size:17px;margin:0 0 4px}.modal p{font-size:12px;color:#6b6b70;margin:0 0 14px}
  #editbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:750;background:var(--bg);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:12px 14px;width:min(520px,calc(100vw - 24px));display:none}
  #editbar.on{display:block}
  #editbar .er{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #editbar input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #d0d0d5;border-radius:8px;width:110px}
  .zoneLbl{background:transparent;border:0;box-shadow:none;font-weight:700;font-size:12px;color:#333;text-shadow:0 0 3px #fff,0 0 3px #fff}
  @media (prefers-color-scheme:dark){:root{--bg:rgba(28,28,30,.96);--fg:#f2f2f7;--muted:#9a9aa2}.readout{background:#2c2c2e}button{background:#3a3a3c;color:#f2f2f7}button.ghost{border-color:#48484a}.field input,#editbar input{background:#2c2c2e;border-color:#48484a;color:#f2f2f7}.modal{background:#1c1c1e}.modal p{color:#9a9aa2}.zoneLbl{color:#eee;text-shadow:0 0 3px #000,0 0 3px #000}}
</style>

<body>
<div id="map"></div>
<div id="crosshair"><span class="dot"></span></div>

<div id="panel">
  <h1>찰랑 권역 편집기 <span id="mode" class="modeBadge read">읽기</span></h1>
  <div class="online" id="online">접속: …</div>
  <div class="readout" id="readout">…</div>
  <div class="row" id="writeRow" style="display:none">
    <button class="primary" id="btnDraw">＋ 다각형 그리기</button>
  </div>
  <div class="row">
    <button id="btnFeedback">이 중심에 피드백</button>
    <button class="ghost" id="btnFly">주소로 이동</button>
  </div>
  <div class="row">
    <button class="ghost" id="btnExport">seed JSON 내보내기</button>
    <button class="ghost" id="btnSeed" style="display:none">기본 권역 올리기</button>
  </div>
  <div class="hint" id="hint">읽기 모드: 지도를 움직이면 중심 권역을 확인하고, 피드백을 남길 수 있어요. 편집하려면 새로고침 후 암호를 입력하세요.</div>
</div>

<div id="editbar">
  <div class="er">
    <b id="eb_title">편집 중</b>
    <input id="eb_name" placeholder="이름">
    <input id="eb_region" placeholder="지역" style="width:120px">
    <input id="eb_priority" type="number" placeholder="priority" style="width:90px">
    <label style="font-size:12px;display:flex;align-items:center;gap:4px"><input id="eb_enabled" type="checkbox" style="width:auto">활성</label>
    <button class="primary" id="eb_save">저장</button>
    <button class="ghost" id="eb_cancel">취소</button>
    <button class="ghost" id="eb_delete" style="color:#e0361f">삭제</button>
  </div>
  <div class="hint">꼭짓점을 드래그해 옮기고, 변 중간을 눌러 점을 추가, 점을 우클릭해 삭제해요. 다 되면 저장.</div>
</div>

<div class="modal-bg" id="login">
  <div class="modal">
    <h2>찰랑 권역 편집기</h2>
    <p>이름을 입력하세요. 편집하려면 쓰기 암호도 함께 입력하세요. (비우면 읽기 전용)</p>
    <div class="field">이름<input id="in_name" placeholder="예: 민성" autofocus></div>
    <div class="field">쓰기 암호(선택)<input id="in_pw" type="password" placeholder="편집하려면 입력"></div>
    <div class="row" style="margin-top:6px"><button class="primary" id="in_go" style="flex:1">시작</button></div>
    <div class="hint">새로고침하면 세션이 초기화되어 다시 입력합니다(캐시 없음).</div>
  </div>
</div>

 "centerLat": 37.515, "centerLng": 126.8955, "radiusMeters": 500, "adjacentZoneIds": [], "priority": 64, "enabled": true}, {"id": "haeundae", "name": "해운대", "region": "부산 해운대", "centerLat": 35.1587, "centerLng": 129.1604, "radiusMeters": 1200, "adjacentZoneIds": [], "priority": 80, "enabled": true}, {"id": "gwangalli", "name": "광안리", "region": "부산 수영", "centerLat": 35.1532, "centerLng": 129.1186, "radiusMeters": 1000, "adjacentZoneIds": [], "priority": 78, "enabled": true}, {"id": "seomyeon", "name": "서면", "region": "부산 부산진", "centerLat": 35.1577, "centerLng": 129.0594, "radiusMeters": 800, "adjacentZoneIds": ["jeonpo"], "priority": 70, "enabled": true}, {"id": "jeonpo", "name": "전포", "region": "부산 부산진", "centerLat": 35.152, "centerLng": 129.064, "radiusMeters": 500, "adjacentZoneIds": ["seomyeon"], "priority": 68, "enabled": true}, {"id": "nampo", "name": "남포동", "region": "부산 중구", "centerLat": 35.0975, "centerLng": 129.03, "radiusMeters": 700, "adjacentZoneIds": [], "priority": 66, "enabled": true}, {"id": "songdo", "name": "송도", "region": "인천 연수", "centerLat": 37.3826, "centerLng": 126.6438, "radiusMeters": 1500, "adjacentZoneIds": [], "priority": 62, "enabled": true}, {"id": "wolmido", "name": "월미도", "region": "인천 중구", "centerLat": 37.474, "centerLng": 126.597, "radiusMeters": 800, "adjacentZoneIds": [], "priority": 58, "enabled": true}, {"id": "pangyo", "name": "판교", "region": "경기 성남", "centerLat": 37.395, "centerLng": 127.111, "radiusMeters": 900, "adjacentZoneIds": [], "priority": 55, "enabled": true}, {"id": "suwonhaeng", "name": "행궁동", "region": "경기 수원", "centerLat": 37.282, "centerLng": 127.014, "radiusMeters": 700, "adjacentZoneIds": [], "priority": 60, "enabled": true}, {"id": "gangneung", "name": "강릉", "region": "강원 강릉", "centerLat": 37.771, "centerLng": 128.947, "radiusMeters": 1500, "adjacentZoneIds": [], "priority": 64, "enabled": true}, {"id": "sokcho", "name": "속초", "region": "강원 속초", "centerLat": 38.207, "centerLng": 128.591, "radiusMeters": 1500, firebase.initializeApp(FIREBASE_CONFIG);

let me = { name:"", mode:"read", sid: Math.random().toString(36).slice(2,10) };
let zoneLayers = new Map();   // id -> {data, layer, kind}

// ---- 지오메트리 ----
function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dLat=r(c-a),dLng=r(d-b);const t=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(t)));}
function pip(lat,lng,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const ai=ring[i],aj=ring[j];if((ai[0]>lat)!==(aj[0]>lat)){const x=ai[1]+(lat-ai[0])/(aj[0]-ai[0])*(aj[1]-ai[1]);if(lng<x)ins=!ins;}}return ins;}
function centroid(r){let x=0,y=0;r.forEach(p=>{x+=p[0];y+=p[1]});return[x/r.length,y/r.length];}
function round6(v){return Math.round(v*1e6)/1e6;}
function ringOf(zl){return zl.layer.getLatLngs()[0].map(ll=>[ll.lat,ll.lng]);}

// ---- 지도 ----
const map=L.map('map',{zoomControl:true}).setView([37.5563,126.9237],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.on('move',refreshReadout);

function lockState(id){const l=locks[id];if(!l)return null;if(Date.now()-l.at>LOCK_STALE_MS)return null;return l;}
function isLockedByOther(id){const l=lockState(id);return l&&l.sid!==me.sid;}

function colorFor(id,z){if(editing===id)return '#0a84ff';if(isLockedByOther(id))return 'var(--lock)';return z.enabled?(z._added?'#12a150':'#ff7a1a'):'#9a9aa2';}
function styleLayer(id,zl){const z=zl.data;const col=isLockedByOther(id)?'#e0361f':(editing===id?'#0a84ff':(z.enabled?'#ff7a1a':'#9a9aa2'));
  zl.layer.setStyle({color:col,weight:editing===id?3:2,fillOpacity:z.enabled?0.10:0.03,dashArray:z.enabled?null:'4 4'});}

function makeLayer(id,z){
  let layer,kind;
  if(z.polygon&&z.polygon.length>=3){kind='polygon';layer=L.polygon(z.polygon.map(p=>[p.lat,p.lng])).addTo(map);}
  else{kind='circle';layer=L.circle([z.centerLat,z.centerLng],{radius:z.radiusMeters||300}).addTo(map);}
  const zl={data:z,layer,kind};layer.zl=zl;
  layer.bindTooltip(z.name,{permanent:true,direction:'center',className:'zoneLbl'});
  layer.on('click',()=>openZonePopup(id,zl));
  layer.on('pm:edit',()=>{});
  zoneLayers.set(id,zl);styleLayer(id,zl);
  return zl;
}
function removeLayer(id){const zl=zoneLayers.get(id);if(zl){zl.layer.remove();zoneLayers.delete(id);}}
function applyDoc(id,data){
  if(editing===id)return;            // 내가 편집 중인 건 원격 변경으로 덮지 않음
  removeLayer(id);makeLayer(id,data);
}

// ---- 팝업(정보/편집/피드백) ----
let popup=L.popup();
function openZonePopup(id,zl){
  const z=zl.data;const l=lockState(id);
  let html=`<b>${z.name}</b> <span style="color:#888">${z.region||''}</span><br><code>${id}</code> · p=${z.priority} · ${z.enabled?'on':'off'} · ${zl.kind}<br>`;
  if(l&&l.sid!==me.sid){html+=`🔒 <b>${l.name}</b> 편집 중`;}
  else if(me.mode==='write'){html+=`<button onclick="window._edit('${id}')">편집</button> `;}
  html+=`<button onclick="window._fb('${id}')">피드백</button>`;
  if(zl.kind==='circle'&&me.mode==='write'&&!(l&&l.sid!==me.sid)) html+=` <button onclick="window._toPoly('${id}')">다각형화</button>`;
  const c=zl.kind==='polygon'?centroid(ringOf(zl)):[z.centerLat,z.centerLng];
  popup.setLatLng(c).setContent(html).openOn(map);
}
window._fb=(id)=>{const zl=zoneLayers.get(id);const n=prompt(`"${zl.data.name}" 피드백:`);if(n){db.collection('zoneFeedback').add({zoneId:id,name:zl.data.name,by:me.name,note:n,at:FV.serverTimestamp()});map.closePopup();alert('피드백 전송됨');}};

// ---- 편집 잠금 ----
window._edit=async(id)=>{
  if(me.mode!=='write')return;
  if(editing){alert('한 번에 하나만 편집할 수 있어요. 먼저 저장/취소하세요.');return;}
  const ref=db.collection('zoneLocks').doc(id);
  try{
    await db.runTransaction(async tx=>{
      const d=await tx.get(ref);const now=Date.now();
      if(d.exists){const l=d.data();const at=l.at&&l.at.toMillis?l.at.toMillis():now;if(l.sid!==me.sid&&(now-at)<LOCK_STALE_MS)throw new Error('LOCKED');}
      tx.set(ref,{name:me.name,sid:me.sid,at:FV.serverTimestamp()});
    });
  }catch(e){alert('다른 사람이 편집 중이에요.');return;}
  editing=id;map.closePopup();
  const zl=zoneLayers.get(id);
  if(zl.kind==='circle'){convertToPolygon(id,zl);} // 원은 편집 위해 다각형으로
  const ezl=zoneLayers.get(id);
  ezl.layer.pm.enable({allowSelfIntersection:false});
  styleLayer(id,ezl);
  openEditBar(id,ezl);
  lockHb=setInterval(()=>ref.update({at:FV.serverTimestamp()}).catch(()=>{}),8000);
};
async function releaseLock(id){if(lockHb){clearInterval(lockHb);lockHb=null;}try{await db.collection('zoneLocks').doc(id).delete();}catch(e){}}
function stopEditingUI(id){const zl=zoneLayers.get(id);if(zl&&zl.layer.pm)zl.layer.pm.disable();document.getElementById('editbar').classList.remove('on');}

function convertToPolygon(id,zl){
  const z=zl.data;if(zl.kind==='polygon')return;
  const n=8,ring=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n;const dLat=(z.radiusMeters*Math.cos(a))/111320;const dLng=(z.radiusMeters*Math.sin(a))/(111320*Math.cos(z.centerLat*Math.PI/180));ring.push([z.centerLat+dLat,z.centerLng+dLng]);}
  removeLayer(id);makeLayer(id,{...z,polygon:ring.map(p=>({lat:p[0],lng:p[1]}))});
}

function openEditBar(id,zl){
  const z=zl.data;
  document.getElementById('eb_title').textContent='편집 중: '+z.name;
  document.getElementById('eb_name').value=z.name||'';
  document.getElementById('eb_region').value=z.region||'';
  document.getElementById('eb_priority').value=z.priority||60;
  document.getElementById('eb_enabled').checked=z.enabled!==false;
  document.getElementById('editbar').classList.add('on');
  document.getElementById('eb_save').onclick=()=>saveEdit(id);
  document.getElementById('eb_cancel').onclick=()=>cancelEdit(id);
  document.getElementById('eb_delete').onclick=()=>deleteZone(id);
}
function serialize(id){
  const zl=zoneLayers.get(id);
  const base={name:document.getElementById('eb_name').value.trim()||zl.data.name,
    region:document.getElementById('eb_region').value.trim(),
    priority:parseInt(document.getElementById('eb_priority').value)||60,
    enabled:document.getElementById('eb_enabled').checked,
    adjacentZoneIds:zl.data.adjacentZoneIds||[]};
  if(zl.kind==='polygon'){const ring=ringOf(zl);const c=centroid(ring);
    base.polygon=ring.map(p=>({lat:round6(p[0]),lng:round6(p[1])}));
    base.centerLat=round6(c[0]);base.centerLng=round6(c[1]);
    base.radiusMeters=Math.round(Math.max(...ring.map(p=>haversine(c[0],c[1],p[0],p[1]))));
  }else{base.centerLat=zl.data.centerLat;base.centerLng=zl.data.centerLng;base.radiusMeters=zl.data.radiusMeters;}
  return base;
}
async function saveEdit(id){
  const data=serialize(id);
  try{await db.collection('zones').doc(id).set(data);}catch(e){alert('저장 실패: '+e.message);return;}
  stopEditingUI(id);await releaseLock(id);editing=null;
  const doc=await db.collection('zones').doc(id).get();applyDoc(id,doc.data());
}
async function cancelEdit(id){
  stopEditingUI(id);await releaseLock(id);editing=null;
  const doc=await db.collection('zones').doc(id).get();if(doc.exists)applyDoc(id,doc.data());else removeLayer(id);
}
async function deleteZone(id){
  if(!confirm('이 권역을 삭제할까요? 앱에도 반영됩니다.'))return;
  stopEditingUI(id);editing=null;
  try{await db.collection('zones').doc(id).delete();}catch(e){alert('삭제 실패: '+e.message);}
  await releaseLock(id);removeLayer(id);
}
window._toPoly=(id)=>{const zl=zoneLayers.get(id);convertToPolygon(id,zl);map.closePopup();alert('다각형으로 바꿨어요. "편집"으로 모양을 다듬고 저장하세요.');};

// ---- 새 다각형 그리기 ----
document.getElementById('btnDraw').onclick=()=>{if(me.mode!=='write')return;map.pm.enableDraw('Polygon');};
map.on('pm:create',e=>{
  if(e.shape!=='Polygon'||me.mode!=='write'){e.layer.remove();return;}
  const layer=e.layer;const ring=layer.getLatLngs()[0].map(ll=>[ll.lat,ll.lng]);layer.remove();
  const id=prompt('새 권역 id (영문, 고유):');if(!id){return;}
  if(zoneLayers.has(id)){alert('이미 있는 id 예요.');return;}
  const name=prompt('이름:')||id;
  const c=centroid(ring);
  const data={name,region:'',priority:60,enabled:true,adjacentZoneIds:[],
    polygon:ring.map(p=>({lat:round6(p[0]),lng:round6(p[1])})),
    centerLat:round6(c[0]),centerLng:round6(c[1]),
    radiusMeters:Math.round(Math.max(...ring.map(p=>haversine(c[0],c[1],p[0],p[1]))))};
  db.collection('zones').doc(id).set(data).catch(err=>alert('생성 실패: '+err.message));
});

// ---- 중심 피드백 / 이동 / 내보내기 / seed ----
document.getElementById('btnFeedback').onclick=()=>{const ctr=map.getCenter();const n=prompt('이 중심 위치 피드백:');if(n){db.collection('zoneFeedback').add({zoneId:null,by:me.name,lat:ctr.lat,lng:ctr.lng,note:n,at:FV.serverTimestamp()});alert('피드백 전송됨');}};
document.getElementById('btnFly').onclick=async()=>{const q=prompt('이동할 장소/주소:');if(!q)return;try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'ko'}});const j=await r.json();if(j[0])map.setView([+j[0].lat,+j[0].lon],15);else alert('결과 없음');}catch(e){alert('검색 실패: '+e.message);}};
document.getElementById('btnExport').onclick=()=>{
  const out=[...zoneLayers.entries()].map(([id,zl])=>{const z=zl.data;const o={id,name:z.name,region:z.region||'',centerLat:z.centerLat,centerLng:z.centerLng,radiusMeters:z.radiusMeters,adjacentZoneIds:z.adjacentZoneIds||[],priority:z.priority,enabled:z.enabled!==false};if(z.polygon)o.polygon=z.polygon.map(p=>[p.lat,p.lng]);return o;});
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='location_zones.seed.json';a.click();
};
document.getElementById('btnSeed').onclick=async()=>{
  if(!confirm('기본 권역 '+SEED_ZONES.length+'개를 Firestore에 올릴까요? (기존 동일 id 는 덮어씀)'))return;
  const batch=db.batch();
  SEED_ZONES.forEach(z=>{const{id,...rest}=z;batch.set(db.collection('zones').doc(id),rest);});
  try{await batch.commit();alert('올렸어요.');}catch(e){alert('실패: '+e.message);}
};

// ---- 중심 판정 표시 ----
function judge(lat,lng){const m=[];for(const[id,zl]of zoneLayers){if(zl.data.enabled===false)continue;if(zl.kind==='polygon'){const ring=ringOf(zl);if(ring.length>=3&&pip(lat,lng,ring))m.push({id,zl,dist:haversine(lat,lng,...centroid(ring))});}else{const d=haversine(lat,lng,zl.data.centerLat,zl.data.centerLng);if(d<=zl.data.radiusMeters)m.push({id,zl,dist:d});}}m.sort((a,b)=>a.zl.data.priority!==b.zl.data.priority?b.zl.data.priority-a.zl.data.priority:a.dist-b.dist);return m;}
function refreshReadout(){const c=map.getCenter();const m=judge(c.lat,c.lng);let h=`<div><span class="muted">중심</span> <code>${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</code></div>`;if(m.length){h+=`<div class="zone">📍 ${m[0].zl.data.name} <span class="muted">${m[0].zl.data.region||''}</span></div>`;if(m.length>1)h+=`<div class="muted">겹침 ${m.length}: ${m.map(x=>x.zl.data.name).join(', ')}</div>`;}else h+=`<div class="zone">권역 밖</div>`;document.getElementById('readout').innerHTML=h;}

// ---- 실시간 구독 ----
function startListeners(){
  db.collection('zones').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed')removeLayer(ch.doc.id);
      else applyDoc(ch.doc.id,ch.doc.data());
    });
    document.getElementById('btnSeed').style.display=(me.mode==='write'&&zoneLayers.size===0)?'':'none';
    refreshReadout();
  },err=>console.error('zones',err));

  db.collection('zoneLocks').onSnapshot(snap=>{
    locks={};snap.forEach(d=>{const l=d.data();locks[d.id]={name:l.name,sid:l.sid,at:l.at&&l.at.toMillis?l.at.toMillis():Date.now()};});
    for(const[id,zl]of zoneLayers){styleLayer(id,zl);}
  },err=>console.error('locks',err));

  db.collection('zoneEditorPresence').onSnapshot(snap=>{
    const now=Date.now();const users=[];snap.forEach(d=>{const p=d.data();const at=p.at&&p.at.toMillis?p.at.toMillis():now;if(now-at<PRESENCE_STALE_MS)users.push(p);});
    document.getElementById('online').innerHTML='접속 '+users.length+'명: '+users.map(u=>`<b>${u.name}</b>${u.mode==='write'?'✏️':''}`).join(', ');
  },err=>console.error('presence',err));
}
function startPresence(){
  const ref=db.collection('zoneEditorPresence').doc(me.sid);
  const beat=()=>ref.set({name:me.name,mode:me.mode,at:FV.serverTimestamp()}).catch(()=>{});
  beat();presenceHb=setInterval(beat,10000);
  window.addEventListener('beforeunload',()=>{ref.delete();if(editing)db.collection('zoneLocks').doc(editing).delete();});
}

// ---- 로그인 ----
document.getElementById('in_go').onclick=async()=>{
  const name=document.getElementById('in_name').value.trim();
  if(!name){alert('이름을 입력하세요.');return;}
  const pw=document.getElementById('in_pw').value;
  me.name=name;me.mode=(pw===WRITE_PW)?'write':'read';
  document.getElementById('login').style.display='none';
  const badge=document.getElementById('mode');badge.textContent=me.mode==='write'?'쓰기':'읽기';badge.className='modeBadge '+me.mode;
  document.getElementById('writeRow').style.display=me.mode==='write'?'':'none';
  document.getElementById('hint').textContent=me.mode==='write'?'권역을 클릭 → "편집"으로 잠그고 꼭짓점을 드래그해 수정 후 저장하세요. 한 번에 하나씩.':'읽기 모드: 지도를 움직여 권역 확인 + 피드백 가능. 편집하려면 새로고침 후 암호(486)를 입력하세요.';
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.NONE); // 캐시 없음: 새로고침=새 세션
    await auth.signInAnonymously();
  }catch(e){alert('접속 실패: '+e.message);return;}
  startListeners();startPresence();refreshReadout();
};
document.getElementById('in_name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('in_pw').focus();});
document.getElementById('in_pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('in_go').click();});
</script>
